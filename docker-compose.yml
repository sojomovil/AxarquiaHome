services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/backend/TerraParadise.Api/TerraParadise.Api.csproj
        APP_DLL: TerraParadise.Api.dll
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TerraParadiseDb: "Server=sqlserver,1433;Database=TerraParadiseDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      Cors__AllowedOrigins__0: http://localhost:4200
      Https__Redirect: "false"
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/backend/TerraParadise.Worker/TerraParadise.Worker.csproj
        APP_DLL: TerraParadise.Worker.dll
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__TerraParadiseDb: "Server=sqlserver,1433;Database=TerraParadiseDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"

volumes:
  sqlserver-data:
